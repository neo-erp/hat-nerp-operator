name: Bounded worker input
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  input:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt
      - name: Check and test maintained bounded-input module
        run: |
          rustfmt +1.97.0 --edition 2024 --check src/bounded_input.rs
          rustc +1.97.0 --edition 2024 --test src/bounded_input.rs -o "$RUNNER_TEMP/bounded-input-tests"
          "$RUNNER_TEMP/bounded-input-tests"
